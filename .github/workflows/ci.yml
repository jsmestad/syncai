name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25.x', '1.26.x']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Download modules
        run: go mod download
      - name: Run checks
        run: make check
      - name: Run race tests
        run: go test -race ./...

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install analyzers
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Run complete CI checks
        run: make ci
